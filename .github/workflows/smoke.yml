# Opens a PDF in the built app on a macOS runner, draws a pen stroke with simulated mouse input, saves,
# and checks that the file gained an annotation. Screenshots are uploaded. Run it by hand from the Actions tab.
name: UI smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZenPDF.app
        run: ./build.sh

      - name: Open, draw and save
        run: |
          set -x
          brew install cliclick >/dev/null
          mkdir -p shots
          cp Tests/ZenPDFTests/Fixtures/windows-saved.pdf "$RUNNER_TEMP/doc.pdf"
          count() { LC_ALL=C grep -a -o -E '/ZenPDF[^A-Za-z]' "$RUNNER_TEMP/doc.pdf" | wc -l | tr -d ' '; }
          before=$(count)

          cat > "$RUNNER_TEMP/windows.swift" <<'SWIFT'
          import CoreGraphics
          let all = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] ?? []
          for w in all where (w[kCGWindowOwnerName as String] as? String) == "ZenPDF" {
              print("window", w[kCGWindowName as String] ?? "-", w[kCGWindowBounds as String] ?? "-",
                    "onscreen:", w[kCGWindowIsOnscreen as String] ?? false, "layer:", w[kCGWindowLayer as String] ?? "-")
          }
          SWIFT
          diagnose() {
            swift "$RUNNER_TEMP/windows.swift" | tee "shots/windows-$1.txt" || true
            sample ZenPDF 1 -file "shots/sample-$1.txt" >/dev/null 2>&1 || true
            grep -A40 "Thread_.*DispatchQueue_1: com.apple.main-thread" "shots/sample-$1.txt" | head -60 || true
          }

          # Launch without a file: the welcome window.
          open -a "$PWD/build/ZenPDF.app" --stdout "$PWD/shots/stdout.log" --stderr "$PWD/shots/stderr.log"
          sleep 8
          pgrep -x ZenPDF
          screencapture -x shots/0-launched.png
          diagnose launch

          # Then open the PDF in the running app.
          open -a "$PWD/build/ZenPDF.app" "$RUNNER_TEMP/doc.pdf"
          sleep 8
          pgrep -x ZenPDF
          screencapture -x shots/1-opened.png
          diagnose opened

          bounds=$(osascript -e 'tell application "System Events" to tell process "ZenPDF" to get {position, size} of window 1' || true)
          echo "window: $bounds"
          IFS=', ' read -r wx wy ww wh <<< "$bounds"
          # Without the window bounds, aim at the page on the 1024×768 runner screen.
          cx=$(( ${wx:-0} + ${ww:-1024} / 2 + 120 )); cy=$(( ${wy:-0} + ${wh:-740} / 2 ))

          # Pen tool (P), then drag across the page.
          cliclick "c:$cx,$cy" "kp:esc" "t:p" "dd:$cx,$cy" "dm:$((cx+60)),$((cy+20))" "dm:$((cx+120)),$((cy-10))" "du:$((cx+180)),$((cy+15))"
          sleep 1
          screencapture -x shots/2-drawn.png

          # Highlighter (H) with hold-to-straighten.
          cliclick "t:h" "dd:$((cx-150)),$((cy+80))" "dm:$((cx-60)),$((cy+85))" "w:900" "dm:$((cx+40)),$((cy+82))" "du:$((cx+40)),$((cy+82))"
          sleep 1
          screencapture -x shots/3-highlight.png

          # Save with ⌘S.
          cliclick "kd:cmd" "t:s" "ku:cmd"
          sleep 3
          screencapture -x shots/4-saved.png
          after=$(count)
          echo "ZenPDF annotations in the file: before $before, after $after"
          pgrep -x ZenPDF
          test "$after" -ge $((before + 2))

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: shots/
