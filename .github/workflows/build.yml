# Builds and tests ZenPDF for Mac on every push to main and on pull requests.
# It doesn't publish anything; releases come from release.yml.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test
        env:
          ZENPDF_MAC_FIXTURE: ${{ runner.temp }}/mac-saved.pdf

      - name: Build ZenPDF.app and ZenPDF.dmg
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ZenPDF-mac
          path: build/ZenPDF.dmg

      # A PDF saved by the Mac app, for checking that ZenPDF for Windows opens it.
      - uses: actions/upload-artifact@v4
        with:
          name: mac-saved-fixture
          path: ${{ runner.temp }}/mac-saved.pdf*
