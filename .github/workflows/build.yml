# Builds and tests ZenPDF for Mac on every push to main and on pull requests.
# It doesn't publish anything; releases come from release.yml.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Includes WindowTests, which drive the real window with mouse and key events.
      - name: Tests
        run: swift test
        env:
          ZENPDF_MAC_FIXTURE: ${{ runner.temp }}/mac-saved.pdf
          ZENPDF_SNAPSHOTS: ${{ runner.temp }}/snapshots

      - name: Build ZenPDF.app and ZenPDF.dmg
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ZenPDF-mac
          path: build/ZenPDF.dmg

      # Pictures of the window from WindowTests, and a PDF saved by the Mac app for checking that
      # ZenPDF for Windows opens it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-output
          path: |
            ${{ runner.temp }}/snapshots/
            ${{ runner.temp }}/mac-saved.pdf*
